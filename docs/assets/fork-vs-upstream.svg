<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <rect width="1400" height="760" fill="#0d1117"/>
  <text x="700" y="60" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#f0f6fc">Dota 2 Minify: upstream vs ripDZL hardening fork</text>
  <text x="700" y="96" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#8b949e">Visual summary — see README table for the complete difference list</text>

  <rect x="70" y="140" rx="18" ry="18" width="570" height="540" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <rect x="760" y="140" rx="18" ry="18" width="570" height="540" fill="#161b22" stroke="#2f81f7" stroke-width="2"/>

  <text x="355" y="190" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#f0f6fc">Egezenn upstream main</text>
  <text x="355" y="220" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#8b949e">bd86c7c… / v2rc4 code baseline</text>

  <text x="110" y="275" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#c9d1d9">• PyWebView + Svelte application shell</text>
  <text x="110" y="318" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#c9d1d9">• Plugin architecture + D2PFX integration</text>
  <text x="110" y="361" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#c9d1d9">• Direct-child mod discovery</text>
  <text x="110" y="404" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#c9d1d9">• Manifest/category conflict handling</text>
  <text x="110" y="447" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#c9d1d9">• Standard patch workflow</text>
  <text x="110" y="490" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#c9d1d9">• Automatic prelaunch option available</text>
  <text x="110" y="533" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#c9d1d9">• Upstream Remove Weather blacklist</text>
  <text x="110" y="576" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#c9d1d9">• Upstream v2 security / lifecycle behavior</text>

  <text x="1045" y="190" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#58a6ff">ripDZL hardening fork</text>
  <text x="1045" y="220" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#8b949e">v21.4-hardening</text>

  <text x="800" y="275" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#c9d1d9">• Hardened downloads, archives, paths &amp; cursors</text>
  <text x="800" y="318" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#c9d1d9">• Recursive mods, Collections, profiles &amp; favorites</text>
  <text x="800" y="361" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#c9d1d9">• Collision index, preflight, restore &amp; rollback</text>
  <text x="800" y="404" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#c9d1d9">• List/Cards library + D2PFX category controls</text>
  <text x="800" y="447" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#c9d1d9">• Dark Terrain / river resource-level compatibility</text>
  <text x="800" y="490" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#c9d1d9">• Remove Weather Showcase black-panel fix</text>
  <text x="800" y="533" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#c9d1d9">• Transparent HUD legacy compatibility</text>
  <text x="800" y="576" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#c9d1d9">• Live patch status, terminal &amp; Windows hardening</text>

  <rect x="455" y="710" width="18" height="18" rx="4" fill="#3fb950"/>
  <text x="483" y="724" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#8b949e">automated validation</text>
  <rect x="665" y="710" width="18" height="18" rx="4" fill="#d29922"/>
  <text x="693" y="724" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#8b949e">human smoke pending for some items</text>
</svg>