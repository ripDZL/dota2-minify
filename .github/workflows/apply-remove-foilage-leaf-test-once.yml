name: Apply Remove Foilage leaf test once

on:
  push:
    branches:
      - v21.4-hardening
    paths:
      - .github/workflows/apply-remove-foilage-leaf-test-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v21.4-hardening
          fetch-depth: 0
      - name: Apply targeted tree-leaf blacklist variant
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          blacklist_path = Path("Minify/mods/Remove Foilage/blacklist.txt")
          entries = blacklist_path.read_text(encoding="utf-8-sig").splitlines()
          desired = [
              "materials/models/props_tree/tree_oak_leaves_08.vmat_c",
              "materials/models/props_tree/tree_oak_leaves_blank.vmat_c",
              "models/props_tree/tree_oak_leaves_08.vmdl_c",
          ]
          for entry in desired:
              assert entry not in entries, entry

          material_anchor = entries.index("materials/models/props_structures/wood_wall001b.vmat_c") + 1
          entries[material_anchor:material_anchor] = desired[:2]
          model_anchor = entries.index("models/props_teams/banner_radiant.vmdl_c") + 1
          entries[model_anchor:model_anchor] = desired[2:]
          blacklist_path.write_text("\n".join(entries) + "\n", encoding="utf-8")

          regression = '''import json
          from pathlib import Path


          ROOT = Path(__file__).resolve().parents[1]
          REMOVE_FOILAGE = ROOT / "Minify" / "mods" / "Remove Foilage"
          DARK_TERRAIN = ROOT / "Minify" / "mods" / "Dark Terrain"
          EXPECTED_TREE_FOLIAGE = {
              "materials/models/props_tree/tree_oak_leaves_08.vmat_c",
              "materials/models/props_tree/tree_oak_leaves_blank.vmat_c",
              "models/props_tree/tree_oak_leaves_08.vmdl_c",
          }


          def test_remove_foilage_keeps_only_targeted_tree_leaf_resources():
              entries = (REMOVE_FOILAGE / "blacklist.txt").read_text(encoding="utf-8").splitlines()
              tree_entries = {
                  entry
                  for entry in entries
                  if entry.startswith("materials/models/props_tree/")
                  or entry.startswith("models/props_tree/")
              }

              assert tree_entries == EXPECTED_TREE_FOLIAGE
              assert "materials/models/props_tree/tree_oak_leaves_05.vmat_c" not in entries
              assert "models/props_tree/tree_oak_leaves_05.vmdl_c" not in entries
              assert "materials/models/props_nature/fern001.vmat_c" in entries


          def test_dark_terrain_keeps_remove_foilage_dependency():
              manifest = json.loads((DARK_TERRAIN / "manifest.json").read_text(encoding="utf-8"))

              assert manifest.get("dependencies") == ["Remove Foilage"]
          '''
          Path("tests/test_remove_foilage_regression.py").write_text(
              "\n".join(line[10:] if line.startswith("          ") else line for line in regression.splitlines()) + "\n",
              encoding="utf-8",
          )

          compat_path = Path("tests/test_v2131_compatibility.py")
          source = compat_path.read_text(encoding="utf-8")
          old = '''    def test_remove_foilage_is_blacklist_only_and_preserves_stock_tree_assets(self):
              self.assertFalse((FOILAGE / "manifest.json").exists())
              self.assertFalse((FOILAGE / "maps" / "dota.vpk").exists())
              entries = (FOILAGE / "blacklist.txt").read_text(encoding="utf-8-sig").splitlines()
              tree_prefixes = (
                  "materials/models/props_tree/",
                  "models/props_tree/",
              )
              self.assertFalse(any(entry.startswith(tree_prefixes) for entry in entries))
              self.assertIn("materials/models/props_nature/fern001.vmat_c", entries)
          '''
          new = '''    def test_remove_foilage_is_blacklist_only_and_targets_tree_leaves_only(self):
              self.assertFalse((FOILAGE / "manifest.json").exists())
              self.assertFalse((FOILAGE / "maps" / "dota.vpk").exists())
              entries = (FOILAGE / "blacklist.txt").read_text(encoding="utf-8-sig").splitlines()
              tree_entries = {
                  entry
                  for entry in entries
                  if entry.startswith("materials/models/props_tree/")
                  or entry.startswith("models/props_tree/")
              }
              self.assertEqual(
                  tree_entries,
                  {
                      "materials/models/props_tree/tree_oak_leaves_08.vmat_c",
                      "materials/models/props_tree/tree_oak_leaves_blank.vmat_c",
                      "models/props_tree/tree_oak_leaves_08.vmdl_c",
                  },
              )
              self.assertNotIn("materials/models/props_tree/tree_oak_leaves_05.vmat_c", entries)
              self.assertNotIn("models/props_tree/tree_oak_leaves_05.vmdl_c", entries)
              self.assertIn("materials/models/props_nature/fern001.vmat_c", entries)
          '''
          old = "\n".join(line[10:] if line.startswith("          ") else line for line in old.splitlines())
          new = "\n".join(line[10:] if line.startswith("          ") else line for line in new.splitlines())
          assert old in source
          compat_path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          rm .github/workflows/apply-remove-foilage-leaf-test-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Minify/mods/Remove Foilage/blacklist.txt" tests/test_remove_foilage_regression.py tests/test_v2131_compatibility.py .github/workflows/apply-remove-foilage-leaf-test-once.yml
          git commit -m "test(mod): target oak leaf foliage without stock tree models"
          git push origin HEAD:v21.4-hardening
