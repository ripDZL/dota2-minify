name: Apply backup manifest hardening

on:
  push:
    branches: [v21.4-hardening]
    paths:
      - tools/apply_backup_manifest_hardening.py
      - .github/workflows/backup-hardening-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      - run: uv run python tools/apply_backup_manifest_hardening.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format Minify/core/backup_manager.py tests/test_backup_security.py
          uv run python -m compileall -q Minify tests
          uv run ruff check Minify
          uv run pytest tests/test_backup_security.py
      - name: Commit materialized fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply_backup_manifest_hardening.py .github/workflows/backup-hardening-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'security: reject backup manifest symlinks'
          git push origin HEAD:v21.4-hardening
