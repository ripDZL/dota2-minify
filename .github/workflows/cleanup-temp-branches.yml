name: Cleanup temporary branches

on:
  push:
    branches:
      - v21.4-hardening
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          branches = [
              "v21.2-ui-reference",
              "v21.4-ui-format",
              "v21.4-v2131-integration",
              "v21.4-v2131-regressions",
          ]

          for branch in branches:
              ref = urllib.parse.quote(f"heads/{branch}", safe="/")
              url = f"https://api.github.com/repos/{repo}/git/refs/{ref}"
              request = urllib.request.Request(
                  url,
                  method="DELETE",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      if response.status != 204:
                          raise RuntimeError(f"Unexpected HTTP {response.status} deleting {branch}")
                  print(f"deleted {branch}")
              except urllib.error.HTTPError as exc:
                  if exc.code == 422:
                      print(f"already absent: {branch}")
                      continue
                  raise
          PY
