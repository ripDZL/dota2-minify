name: Fix uniform Home test once

on:
  push:
    branches:
      - v21.4-hardening
    paths:
      - .github/workflows/fix-uniform-home-test-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Update responsive action-width contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_modern_ui.py")
          text = path.read_text(encoding="utf-8")
          old = '    assert "patch_width = max(180, int(action_cluster_width * 0.58))" in WINDOW\n    assert "refresh_width = max(140, action_cluster_width - patch_width - 8)" in WINDOW\n'
          new = '    assert "equal_action_width = max(180, (action_cluster_width - 8) // 2)" in WINDOW\n    assert "patch_width = equal_action_width" in WINDOW\n    assert "refresh_width = equal_action_width" in WINDOW\n'
          if text.count(old) != 1:
              raise SystemExit("expected one stale deployment-width assertion block")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Validate tests
        shell: bash
        run: |
          uv sync --group dev
          uv run ruff format tests/test_modern_ui.py
          uv run python -m compileall -q Minify tests
          uv run ruff check Minify
          uv run pytest

      - name: Remove workflow and commit
        shell: bash
        run: |
          rm .github/workflows/fix-uniform-home-test-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_modern_ui.py .github/workflows/fix-uniform-home-test-once.yml
          git commit -m "test(ui): update uniform Home action contract"
          git push origin HEAD:v21.4-hardening
