name: Apply Obsidian Arc release UI

on:
  push:
    branches:
      - v21.4-hardening

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'ops: apply Obsidian Arc release UI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v21.4-hardening
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync --group dev
      - name: Apply release UI compositor
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_release_ui_once.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('read_text(encoding="utf-8")nd2pfx =', 'read_text(encoding="utf-8")\nd2pfx =')
          p.write_text(text, encoding='utf-8')
          PY
          python -m py_compile tools/apply_release_ui_once.py
          python tools/apply_release_ui_once.py
          uv run ruff format Minify/__main__.py Minify/ui/theme.py Minify/ui/checkboxes.py Minify/browsers/d2pfx/ui.py tests/test_modern_ui.py
          uv run python -m compileall -q Minify tests
          uv run ruff check Minify
          uv run pytest tests/test_modern_ui.py
      - name: Commit materialized release UI
        run: |
          git rm .github/workflows/release-ui-refresh.yml tools/apply_release_ui_once.py
          git add Minify/__main__.py Minify/ui/theme.py Minify/ui/checkboxes.py Minify/browsers/d2pfx/ui.py tests/test_modern_ui.py
          git diff --check --cached
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ui: compose Obsidian Arc release interface"
          git push origin HEAD:v21.4-hardening
