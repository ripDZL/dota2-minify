name: One-time v21.4 materialization

on:
  push:
    branches: [v21.4-hardening]
    paths:
      - .materialize/READY

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Reconstruct validated handoff
        shell: bash
        run: |
          set -euo pipefail
          cat .materialize/handoff-*.b64 > "$RUNNER_TEMP/handoff.b64"
          base64 --decode "$RUNNER_TEMP/handoff.b64" > "$RUNNER_TEMP/handoff.zip"
          echo '97b2810c1e0ed2a51a407dd895d93e0f53e95bb82e65824cd41536da799fdece  '"$RUNNER_TEMP/handoff.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/handoff.zip" -d "$RUNNER_TEMP/handoff"

      - name: Validate hardening kit
        shell: bash
        run: |
          set -euo pipefail
          KIT="$RUNNER_TEMP/handoff/Codex-Handoff-Dota2-Minify-v21.4-Hardening-2026-09-04/current-hardening-kit"
          python -m unittest discover -s "$KIT/tests" -p 'test_*.py'
          python -m compileall -q "$KIT/overlay" "$KIT/apply_nested_vpk_patch.py"

      - name: Materialize against exact rc7
        shell: bash
        run: |
          set -euo pipefail
          KIT="$RUNNER_TEMP/handoff/Codex-Handoff-Dota2-Minify-v21.4-Hardening-2026-09-04/current-hardening-kit"
          RC7="$RUNNER_TEMP/rc7"
          git worktree add --detach "$RC7" d4b4520c945a9e1f8f5facc52a76ac5903babe90
          python "$KIT/apply_nested_vpk_patch.py" --source "$RC7"
          python -m compileall -q "$RC7/Minify"
          rsync -a --delete "$RC7/Minify/" Minify/

      - name: Commit materialized source and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .materialize
          rm -f .github/workflows/materialize-v21.4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'materialize v21.4 hardened beta source'
          git push origin HEAD:v21.4-hardening
