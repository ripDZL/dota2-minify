name: Uniform Home actions once

on:
  push:
    branches:
      - v21.4-hardening
    paths:
      - .github/workflows/uniform-home-actions-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Patch uniform Home action widths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path("Minify/__main__.py")
          main = main_path.read_text(encoding="utf-8")
          old_refresh = 'tag="button_refresh_main",\n                    label="RESCAN LIBRARY",\n                    callback=checkboxes.refresh,\n                    width=146,\n                    height=34,'
          new_refresh = 'tag="button_refresh_main",\n                    label="RESCAN LIBRARY",\n                    callback=checkboxes.refresh,\n                    width=210,\n                    height=34,'
          if main.count(old_refresh) != 1:
              raise SystemExit("expected one static Rescan button block")
          main_path.write_text(main.replace(old_refresh, new_refresh), encoding="utf-8")

          window_path = Path("Minify/ui/window.py")
          window = window_path.read_text(encoding="utf-8")
          old_resize = '    else:\n        patch_width = max(180, int(action_cluster_width * 0.58))\n        refresh_width = max(140, action_cluster_width - patch_width - 8)\n'
          new_resize = '    else:\n        equal_action_width = max(180, (action_cluster_width - 8) // 2)\n        patch_width = equal_action_width\n        refresh_width = equal_action_width\n'
          if window.count(old_resize) != 1:
              raise SystemExit("expected one Home action width calculation")
          window_path.write_text(window.replace(old_resize, new_resize), encoding="utf-8")

          test_path = Path("tests/test_home_centered_copy.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "def test_home_deployment_buttons_use_uniform_widths():"
          if marker not in tests:
              tests += '\n\ndef test_home_deployment_buttons_use_uniform_widths():\n    main = (ROOT / "Minify" / "__main__.py").read_text(encoding="utf-8")\n    window = (ROOT / "Minify" / "ui" / "window.py").read_text(encoding="utf-8")\n    patch_start = main.index(\'tag="button_patch"\')\n    refresh_start = main.index(\'tag="button_refresh_main"\')\n    assert "width=210" in main[patch_start : patch_start + 320]\n    assert "width=210" in main[refresh_start : refresh_start + 320]\n    for token in (\n        "equal_action_width = max(180, (action_cluster_width - 8) // 2)",\n        "patch_width = equal_action_width",\n        "refresh_width = equal_action_width",\n    ):\n        assert token in window\n    assert "int(action_cluster_width * 0.58)" not in window\n'
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Validate source
        shell: bash
        run: |
          uv sync --group dev
          uv run ruff format Minify/ui/window.py Minify/__main__.py tests/test_home_centered_copy.py
          uv run python -m compileall -q Minify tests
          uv run ruff check Minify
          uv run pytest tests/test_home_centered_copy.py tests/test_home_startup_tree.py

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/uniform-home-actions-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Minify/__main__.py Minify/ui/window.py tests/test_home_centered_copy.py .github/workflows/uniform-home-actions-once.yml
          git commit -m "fix(ui): uniform Home action button widths"
          git push origin HEAD:v21.4-hardening
