name: Format restored v21.2 UI

on:
  push:
    branches: [v21.4-ui-format]
    paths: [.github/workflows/format-v21.2-ui.yml]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.13'
      - run: uv sync --group dev
      - name: Format restored UI sources
        run: |
          uv run ruff format \
            Minify/__main__.py \
            Minify/browsers/d2pfx/ui.py \
            Minify/ui/checkboxes.py \
            Minify/ui/theme.py \
            Minify/ui/window.py
          uv run python -m compileall -q Minify
      - name: Commit formatted UI
        run: |
          rm .github/workflows/format-v21.2-ui.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'style: format restored v21.2 UI'
          git push origin HEAD:v21.4-ui-format
