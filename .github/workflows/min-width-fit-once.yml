name: Apply Minimum Width Fit

on:
  push:
    branches: [v21.4-hardening]
    paths:
      - tools/apply_min_width_fit.py
      - .github/workflows/min-width-fit-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v21.4-hardening
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
      - run: uv sync --group dev
      - name: Apply minimum-width fit
        run: uv run python tools/apply_min_width_fit.py
      - name: Format and validate
        run: |
          uv run ruff format Minify/ui/window.py Minify/browsers/d2pfx/ui.py Minify/ui/checkboxes.py tests/test_modern_ui.py
          uv run python -m compileall -q Minify tests
          uv run ruff check Minify
          uv run pytest
      - name: Commit materialized layout changes
        run: |
          if git diff --quiet -- Minify/ui/window.py Minify/browsers/d2pfx/ui.py Minify/ui/checkboxes.py tests/test_modern_ui.py; then
            echo "No materialized change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Minify/ui/window.py Minify/browsers/d2pfx/ui.py Minify/ui/checkboxes.py tests/test_modern_ui.py
          git commit -m "ui: guarantee minimum-width layout fit"
          git push origin HEAD:v21.4-hardening
