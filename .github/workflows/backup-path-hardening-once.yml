name: Apply Backup Path Hardening

on:
  push:
    branches: [v21.4-hardening]
    paths:
      - tools/apply_backup_path_hardening.py
      - .github/workflows/backup-path-hardening-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v21.4-hardening
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
      - run: uv sync --group dev
      - name: Apply backup path hardening
        run: uv run python tools/apply_backup_path_hardening.py
      - name: Format and validate
        run: |
          uv run ruff format Minify/core/backup_manager.py tests/test_backup_security.py
          uv run python -m compileall -q Minify tests
          uv run ruff check Minify
          uv run pytest
      - name: Commit materialized hardening
        run: |
          if git diff --quiet -- Minify/core/backup_manager.py tests/test_backup_security.py; then
            echo "No materialized change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Minify/core/backup_manager.py tests/test_backup_security.py
          git commit -m "security: confine backup live outputs and manifest reads"
          git push origin HEAD:v21.4-hardening
