name: Apply Crimson Slate theme

on:
  push:
    branches:
      - v21.4-hardening

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v21.4-hardening
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync --group dev
      - name: Apply Crimson Slate compositor
        run: |
          python -m py_compile tools/apply_crimson_slate_once.py
          python tools/apply_crimson_slate_once.py
          uv run ruff format Minify/ui/theme.py Minify/ui/checkboxes.py Minify/browsers/d2pfx/ui.py tests/test_modern_ui.py
          uv run python -m compileall -q Minify tests
          uv run ruff check Minify
          uv run pytest tests/test_modern_ui.py
      - name: Commit materialized theme
        run: |
          git rm -f .github/workflows/crimson-slate-once.yml tools/apply_crimson_slate_once.py
          git add Minify/ui/theme.py Minify/ui/checkboxes.py Minify/browsers/d2pfx/ui.py tests/test_modern_ui.py
          git diff --check --cached
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ui: apply Crimson Slate dark theme"
          git push origin HEAD:v21.4-hardening
