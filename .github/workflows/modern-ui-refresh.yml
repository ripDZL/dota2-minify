name: Apply modern UI refresh

on:
  push:
    branches:
      - v21.4-hardening

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v21.4-hardening
          fetch-depth: 0

      - name: Apply UI patch
        run: python tools/apply_modern_ui_once.py

      - name: Commit materialized UI
        run: |
          git rm .github/workflows/modern-ui-refresh.yml tools/apply_modern_ui_once.py
          git add Minify/__main__.py Minify/ui/theme.py Minify/ui/window.py tests/test_modern_ui.py
          git diff --check --cached
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ui: modernize application theme"
          git push origin HEAD:v21.4-hardening
